# Rebuild the PDF CV whenever the data it is generated from changes.
#
# The website itself is built by GitHub Pages' own Jekyll job; this workflow only
# regenerates files/cv.pdf and commits it, so that editing _data/*.yml updates
# the site and the PDF in a single push.

name: Build CV

on:
  push:
    branches: [master]
    paths:
      - '_data/**'
      - 'cv/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moving would change TeX Live
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r cv/requirements.txt

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-extra \
            texlive-pictures texlive-xetex poppler-utils

      - name: Check every LaTeX package the CV needs is present
        # Without this the build fails deep inside pdflatex with an unhelpful
        # "Undefined control sequence". twemojis in particular is recent enough
        # that an older TeX Live would not carry it.
        run: |
          missing=""
          for p in sourceserifpro sourcesanspro fontawesome5 twemojis needspace \
                   newunicodechar ragged2e microtype ifthen tikz enumitem \
                   geometry hyperref xcolor calc; do
            kpsewhich "$p.sty" >/dev/null 2>&1 || missing="$missing $p"
          done
          kpsewhich all-twemojis.pdf >/dev/null 2>&1 || missing="$missing all-twemojis.pdf"
          if [ -n "$missing" ]; then
            echo "::error::missing LaTeX packages:$missing"
            exit 1
          fi
          echo "all LaTeX packages present"

      - name: Build the CV
        # GITHUB_TOKEN lifts the GitHub API rate limit for the star counts.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python cv/build.py

      - name: Commit the regenerated PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/cv.pdf cv/stars.json
          if git diff --staged --quiet; then
            echo "CV unchanged."
          else
            git commit -m "chore: rebuild CV from _data [skip ci]"
            # Needs Settings > Actions > General > Workflow permissions set to
            # "Read and write". A read-only token fails here with a 403.
            git push || {
              echo "::error::push failed — check Settings > Actions > General >"
              echo "::error::Workflow permissions is set to 'Read and write'."
              exit 1
            }
          fi
