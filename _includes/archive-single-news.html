{% include base_path %}

<div class="news-entry">
  {% if post.date %}
    {% assign year = post.date | date: "%Y" %}
    {% assign month = post.date | date: "%m" %}
  {% else %}
    {% assign year = YEAR %}
    {% assign month = MONTH %}
  {% endif %}
  <span class="label label-{{ year }}">{{ month }}/{{ year }}</span>
  <div class="news-text">{{ post.content }}</div>
</div>
