# Collaboration, supervision and advising — relationships only.
#
# Every member is a reference into another registry, never a copy of a name:
#   person:       a key in authors.yml
#   organization: a key in organizations.yml
#
# The advising group deliberately accepts both, since advising can be for an
# individual researcher or for an institution or company.
#
# `with` is an optional list of co-supervisors or partners; each entry is again
# a key in authors.yml or organizations.yml.
#
# Names, homepages and affiliations all come from the registries, so renaming
# someone in authors.yml updates every page at once. cv/build.py fails the build
# if any key here does not resolve.

groups:
