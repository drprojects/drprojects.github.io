# Open-source repositories. `repo` is owner/name, used to fetch stars/forks at
# build time — never hardcode those counts here.
#
# `publication: <id>` links a repo to the paper it implements, in publications.yml.
# The repo keeps its own code_url and teaser_image, since a codebase can serve
# several papers (superpoint_transformer does) and can outlive any one of them.

- id: litept
  publication: litept
  title: LitePT
  date: 2026-06-01
  repo: prs-eth/LitePT
  code_url: https://github.com/prs-eth/LitePT
  description: "Official implementation for [LitePT](https://litept.github.io/)."
  teaser_image: /images/publications/2026/litept/teaser.png
  cv: true

- id: torch_graph_components
  publication: ezsp
  title: torch-graph-components
  date: 2026-01-22
  repo: drprojects/torch-graph-components
  code_url: https://github.com/drprojects/torch-graph-components
  description: "torch-graph-components holds algorithms for fast graph connected components and graph partitioning, fully implemented in PyTorch with GPU parallelization in mind. In particular, this project contains the graph components and graph partitioning algorithms introduced in [EZ-SP](https://louisgeist.github.io/ez-sp)."
  teaser_image: /images/publications/2026/tgc/teaser.png
  cv: true

- id: superpoint_transformer
  publication: superpoint_transformer
  title: Superpoint Transformer
  date: 2023-06-15
  repo: drprojects/superpoint_transformer
  code_url: https://github.com/drprojects/superpoint_transformer
  description: "Official implementation for [Superpoint Transformer](https://drprojects.github.io/superpoint-transformer-site), [SuperCluster](https://drprojects.github.io/supercluster-site), and [EZ-SP](https://louisgeist.github.io/ez-sp). This codebase holds tools for efficient, scalable superpoint-based learning 🧩."
  teaser_image: /images/publications/2023/superpoint_transformer/teaser.png
  cv: true

- id: nora
  title: NoRA
  date: 2023-04-07
  repo: drprojects/nora
  code_url: https://github.com/drprojects/nora
  description: "A python-populated Notion template to help you keep track of the papers you read 📜, their authors 👤, your notes 📝, and more 🔥. This is my personal framework for getting the best of Zotero but in Notion."
  teaser_image: /images/publications/2024/nora/teaser.png
  cv: true

- id: point_geometric_features
  title: Point Geometric Features
  date: 2022-11-17
  repo: drprojects/point_geometric_features
  code_url: https://github.com/drprojects/point_geometric_features
  description: "The pgeof library provides utilities for fast, parallelized computing ⚡ of local geometric features for 3D point clouds ☁️ on CPU. It was initially introduced as a dependency for [Superpoint Transformer](https://drprojects.github.io/superpoint-transformer-site)."
  teaser_image: /images/publications/2023/pgeof/teaser.png
  cv: true

- id: deepviewagg
  publication: deepviewagg
  title: DeepViewAgg
  date: 2022-06-01
  repo: drprojects/DeepViewAgg
  code_url: https://github.com/drprojects/DeepViewAgg
  description: "Official implementation for [DeepViewAgg](https://drprojects.github.io/deepviewagg-site). This codebase holds tools for multimodal learning on 2D images 🖼️ and 3D point clouds ☁️️. In particular, we developed an efficient and scalable framework for learning to densely map and aggregate multi-view image features to point clouds."
  teaser_image: /images/publications/2022/deepviewagg/teaser.png
  cv: true
