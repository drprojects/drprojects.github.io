# Skills, languages and personal. CV-facing, also usable on the website.
#
# Design note: the previous CV listed 15 flat research topics with heavy overlap
# ("superpoint-based learning" / "graph-based learning" / "graph partitioning").
# Grouping them into four themes reads far faster and shows range rather than
# repetition.

research_themes:
  - label: 3D & geometry
    topics:
      - Large-scale 3D point clouds
      - LiDAR data
      - Superpoint-based learning
      - Graph-based learning and graph partitioning

  - label: Efficient & scalable learning
    topics:
      - Efficient deep learning
      - Scalable model design
      - EO data representation and compression

  - label: Learning paradigms
    topics:
      - Multimodal learning
      - Self-supervised learning
      - Representation learning

  - label: Environment & Earth observation
    topics:
      - Remote sensing
      - Forest structure analysis
      - Species distribution modeling
      - Representation learning for macroecology

# Ordered by fluency/centrality, most important first.
# `logo` names a file in cv/assets/logos/ and is optional: a tool without one
# renders as text in the CV. `group` is currently unused by either renderer.
