# Institutions, labs and companies.
#
# The counterpart to authors.yml: anything that is an *organisation* rather than
# a person. Referenced by key from authors.yml (`org:`), supervision.yml and
# teaching.yml, so a name and its URL are written exactly once.
#
# Fields: name (required), short, url, location.
#
# TODO — no URL recorded for the following, so they are left blank rather
# than guessed. Fill one in here and every reference to it, on the website
# and in the CV, picks it up:
#
#   basch, centrale_lyon, chateaubriand, cnrs, coursera, engie, icvss
#   inspirama, oxford, udacity

