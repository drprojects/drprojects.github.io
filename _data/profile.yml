# Two summaries: the website one may use inline HTML links, the CV one is plain
# prose that must survive LaTeX escaping.
summary:
  web: >
    I am a postdoctoral researcher in the <a href="https://dm3l.uzh.ch/en/wegner">EcoVision</a>
    lab at <a href="https://www.uzh.ch/en.html">University of Zurich</a>, I collaborate with
    <a href="https://dm3l.uzh.ch/member/wegner">Jan Dirk Wegner</a> to design deep learning
    methods for remote sensing and environmental applications.
    Before joining UZH, I completed my PhD on <i>"Efficient Learning on Large-Scale 3D Point
    Clouds"</i> at <a href="https://www.ign.fr">IGN</a> and
    <a href="https://www.engie.com">ENGIE</a>, under the supervision of
    <a href="https://loiclandrieu.com/">Loïc Landrieu</a> and
    <a href="https://www.umr-lastig.fr/bruno-vallet/">Bruno Vallet</a>.
  cv: >
    Postdoctoral researcher in the EcoVision lab at University of Zurich, collaborating with
    Jan D. Wegner. I am broadly interested in deep learning for real-world data and impactful
    applications, with a taste for approaches making deep learning research socially and
    environmentally beneficial, accessible and reproducible. My recent work focuses on
    efficient and scalable deep learning, forest structure analysis, and species distribution
    modeling.

