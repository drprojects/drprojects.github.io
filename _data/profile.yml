# ONE intro, used by the website landing page and the PDF CV alike.
# Written in markdown: the site renders it with markdownify, cv/build.py turns
# the links into \href. Edit here and both update.
summary: >
  I am a postdoctoral researcher in the [EcoVision](https://dm3l.uzh.ch/en/wegner) lab at
  [University of Zurich](https://www.uzh.ch/en.html), I collaborate with
  [Jan Dirk Wegner](https://dm3l.uzh.ch/member/wegner) to design deep learning methods for
  remote sensing and environmental applications. Before joining UZH, I completed my PhD on
  _"Efficient Learning on Large-Scale 3D Point Clouds"_ at [IGN](https://www.ign.fr) and
  [ENGIE](https://www.engie.com), under the supervision of
  [Loic Landrieu](https://loiclandrieu.com/) and
  [Bruno Vallet](https://www.umr-lastig.fr/bruno-vallet/).

# Display switches for the PDF CV. The data stays in _data/ either way; these
