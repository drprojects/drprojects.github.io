#   role: Work-package lead       # your role in it
#   organization: <key>           # a key in organizations.yml, if it has a home
#   url: https://embed2scale.eu   # linked from the title on the website
#   scale: "8 partners, 5 countries, €4M"   # the concrete figure that makes it land
#   description: >                # one line of context, if the title is opaque
#     ...
#   cv: false                     # keep it on the website only
#   web: false                    # or the reverse
#
# A note on writing these: name the scale. "Coordinated 8 partners across 5
# countries" reads as leadership; "project management" reads as filler.
